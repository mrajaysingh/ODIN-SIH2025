name: to_do_app
version: 1.0.0+1
publish_to: "none"

description: "O.D.I.N. - Ocean Disaster Information Network"

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.10+1
  flutter_slidable: ^3.1.0
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  maplibre_gl: ^0.22.0
  geolocator: ^10.1.0
  url_launcher: ^6.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  flutter_cache_manager: ^3.3.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^1.1.3
  build_runner: ^2.1.11
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/splash/
    - assets/startup-sound/
    - assets/images/incident/
    - assets/videos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app-logo.png"
